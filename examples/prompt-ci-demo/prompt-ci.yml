# TEMPLATE — copy this to `.github/workflows/prompt-ci.yml` in a repo that consumes
# Loupe. It is kept here (not under .github/workflows/) so it does not run on the Loupe
# monorepo itself, which has no LOUPE_HOST/LOUPE_API_KEY secrets configured.
#
# See ./README.md for the full killer-flow demo.

name: Prompt CI
on:
  pull_request:
    paths:
      - "examples/prompt-ci-demo/prompts/genre.txt"

jobs:
  loupe:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write     # needed for the PR comment
    steps:
      - uses: actions/checkout@v4
      - uses: Adityachauhan12/loupe/loupe-action@main
        with:
          suite-id: ${{ vars.LOUPE_SUITE_ID }}
          prompt-file: examples/prompt-ci-demo/prompts/genre.txt
          loupe-host: ${{ secrets.LOUPE_HOST }}
          api-key: ${{ secrets.LOUPE_API_KEY }}
          # backend: claude/claude-sonnet-4-6   # optional; default = free Groq/Llama
